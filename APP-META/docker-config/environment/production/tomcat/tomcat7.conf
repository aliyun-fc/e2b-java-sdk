# System-wide configuration file for tomcat7 services
# This will be sourced by tomcat7 and any secondary service
# Values will be overridden by service-specific configuration
# files in /etc/sysconfig
#
# Use this one to change default values for all services
# Change the service specific ones to affect only one service
# (see, for instance, /etc/sysconfig/tomcat7)
#

# Where your java installation lives
JAVA_HOME="/opt/taobao/java/jre"

# Where your tomcat installation lives
CATALINA_BASE="/opt/taobao/tomcat"
CATALINA_HOME="/opt/taobao/tomcat"
JASPER_HOME="/opt/taobao/tomcat"
CATALINA_TMPDIR="/tmp"
CATALINA_LOGS="$CATALINA_HOME"/logs
APPNAME="`ls -1 /alidata/www/apps/tomcat7/ | grep -v taobao-hsf.sar | grep -v grep`"
CPU_COUNT="`grep -c 'cpu[0-9][0-9]*' /proc/stat`"

# You can pass some parameters to java here if you wish to
JAVA_OPTS="
-server
-Xms4g
-Xmx4g
-Xss1m
-XX:MetaspaceSize=512m
-XX:MaxMetaspaceSize=512m
-XX:MaxDirectMemorySize=1024m
-XX:SurvivorRatio=10
-Xmn2g
-XX:+UseConcMarkSweepGC
-XX:+UseCMSCompactAtFullCollection
-XX:CMSMaxAbortablePrecleanTime=5000
-XX:+CMSParallelRemarkEnabled
-XX:+CMSClassUnloadingEnabled
-XX:+UseCMSInitiatingOccupancyOnly
-XX:CMSInitiatingOccupancyFraction=80
-XX:+ExplicitGCInvokesConcurrent
-XX:+UseCMSCompactAtFullCollection
-Dsun.rmi.dgc.server.gcInterval=2592000000
-Dsun.rmi.dgc.client.gcInterval=2592000000
-XX:ParallelGCThreads=$CPU_COUNT
-verbose:gc
-Xloggc:/alidata/www/logs/tomcat7/gc.log
-XX:+PrintGCDetails
-XX:+PrintGCDateStamps
-XX:-HeapDumpOnOutOfMemoryError
-XX:ErrorFile=$CATALINA_HOME/logs/hs_err_pid%p.log
-XX:HeapDumpPath=$CATALINA_HOME/logs/java_pid.hprof
-verbose:gc
-Xloggc:/alidata/www/logs/tomcat7/gc.log
-XX:+PrintGCDetails
-XX:+PrintGCDateStamps
-Dsun.net.inetaddr.ttl=0
-Dcatalina.logs=$CATALINA_HOME/logs
-Dlog4j.defaultInitOverride=true
-Dlog4j.dir=/alidata/www/logs/tomcat7
-Dlog4j.level=WARN
-Dproject.name=$APPNAME
-Dhsf.publish.delayed=true
-Dhsf.server.ip=$(hostname -i)
"

# Use JAVA_OPTS to set java.library.path for libtcnative.so
#JAVA_OPTS="-Djava.library.path=/usr/lib64"

# What user should run tomcat
TOMCAT_USER="tomcat"

# You can change your tomcat locale here
#LANG="en_US"

# Run tomcat under the Java Security Manager
SECURITY_MANAGER="false"

# Time to wait in seconds, before killing process
SHUTDOWN_WAIT="30"

# Whether to annoy the user with "attempting to shut down" messages or not
SHUTDOWN_VERBOSE="false"

# Set the TOMCAT_PID location
CATALINA_PID="/var/run/tomcat7.pid"

# Connector port is 8080 for this tomcat7 instance
#CONNECTOR_PORT="8080"

# If you wish to further customize your tomcat environment,
# put your own definitions here
# (i.e. LD_LIBRARY_PATH for some jdbc drivers)