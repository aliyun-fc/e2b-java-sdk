location @x5_proxy {
    x5 off;

    proxy_pass http://security-nash.alibaba-inc.com;
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
}

location @x5_punish {
    proxy_pass http://security-nash.alibaba-inc.com;
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;

    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header X-TMD-Action $x5_action;
    proxy_set_header X-TMD-App $x5_app;
    proxy_set_header X-TMD-Remote-Addr $x5_remote_addr;
    proxy_set_header X-TMD-Service-ID $x5_service_id;
    proxy_set_header X-TMD-Policy-ID $x5_policy_id;
    proxy_set_header X-TMD-Desc $x5_desc;
    proxy_set_header X-TMD-Origin-Request $scheme://$host$request_uri;
    proxy_set_header Content-Length "";
}

location @x5_close {
    access_by_lua '
        ngx.exit(ngx.ERROR)
    ';
}

location @x5_entry {
    content_by_lua '
        local dest = ngx.var.x5_location;

        if dest == nil or dest == "none" then
            ngx.exit(403)
        end

        -- 执行相关X5拦截动作
        ngx.exec(dest)
    ';
}