x5 on;
x5_sock "/home/admin/xagent/run/xagent.sock";
x5_timeout 10;
x5_uuid on;

log_format x5_config '[$time_iso8601] "$request" $status '
                     '$content_length $body_bytes_sent "$http_user_agent"';

# for t-wag:
# x5_log_custom "logs/t-wag-custom-x5.log" punish;

# X5 本地拦截日志
xmodule_log_format x5 '||$time_local||$remote_addr||$request||$status||$body_bytes_sent||$http_referer||$http_user_agent||$http_x_forwarded_for||$x5_action||$x5_service_id||$x5_test||$x5_check_rt||$x5_policy_id||$x5_desc||';
xmodule_log "pipe:/sbin/cronolog /alidata/www/logs/tengine/%Y/%m/%Y-%m-%d-x5.log" x5 x5_action pass|break|close|deny|wait|captcha|login;

server {
    listen 24066;
    server_name status.tmd.alibaba-inc.com;
    x5 off;

    allow 127.0.0.1;
    deny all;

    access_log "pipe:/sbin/cronolog /alidata/www/logs/tengine/%Y/%m/%Y-%m-%d-x5_config.access.log" x5_config;
    error_log "pipe:/sbin/cronolog /alidata/www/logs/tengine/%Y/%m/%Y-%m-%d-x5_config.error.log" notice;

    location / {
        x5_config;
    }
}

map $x5_action $x5_location {
    "deny"      "@x5_punish";
    "wait"      "@x5_punish";
    "captcha"   "@x5_punish";
    "login"     "@x5_punish";
    "close"     "@x5_close";
    default     "none";
}