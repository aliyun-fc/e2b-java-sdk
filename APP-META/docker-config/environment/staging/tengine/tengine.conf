user              www www;
worker_processes  4;

error_log  "pipe:/usr/sbin/cronolog /var/log/tengine/error.%Y-%m-%d.log" error;
worker_rlimit_nofile 65535;
pid        /var/run/tengine.pid;

events {
    use epoll;
    worker_connections  65535;
}

include dso.conf;

http {
    include       /etc/tengine/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format aliyun_com '"$remote_addr" "$remote_user" "[$time_local]" "$request" "$status" "$body_bytes_sent" "$http_referer" "$http_user_agent" "$request_method http://$host$request_uri" "$host" "aliyun.com" "$http_x_forwarded_for" "$request_time" "$remote_port" "$upstream_response_time" "$http_x_readtime" "$uri"';

    server_names_hash_bucket_size 128;
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;
    client_max_body_size 8m;
    variables_hash_max_size 1024;
    client_body_temp_path /tmp 1 2;
    fastcgi_temp_path /tmp 1 2;
    
    include x5/x5_http.conf;
    server_tokens   off;
    sendfile        on;
    tcp_nopush      on;

    keepalive_timeout  0;

    gzip on;
    gzip_min_length  1k;
    gzip_buffers     4 16k;
    gzip_http_version 1.0;
    gzip_comp_level 2;
    gzip_types       text/plain text/xml text/css application/x-javascript application/xhtml+xml application/json text/javascript application/xml application/javascript;
    gzip_vary on;
  
    fastcgi_connect_timeout 300;
    fastcgi_send_timeout 300;
    fastcgi_read_timeout 300;
    fastcgi_buffer_size 64k;
    fastcgi_buffers 4 64k;
    fastcgi_busy_buffers_size 128k;
    fastcgi_temp_file_write_size 128k;

    server_name_in_redirect off;
    error_page 411 = @my_411_error;

    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $http_remoteip;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect          off;
    proxy_buffers           128 8k;
    proxy_buffer_size       32k;
    proxy_busy_buffers_size 32k;
    proxy_intercept_errors  on;

    charset utf-8;

    beacon   on;
    beacon_cfg /etc/tengine/taobao-beacon.cfg /etc/tengine/taobao-channel.cfg;

    include check_health.conf;
    include conf.d/*.conf;
    error_page 400 http://www.aliyun.com/notfound/;
    error_page 404 http://www.aliyun.com/notfound/;
    error_page 500 http://www.aliyun.com/error/;
    error_page 503 http://www.aliyun.com/error/;
    error_page 504 http://www.aliyun.com/error/;
    error_page 505 http://www.aliyun.com/error/;
    error_page 599 = @599error;
}
