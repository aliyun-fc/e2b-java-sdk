### YOURDOMAIN  --> 填写实际域名
### YOURAPPNAME --> 填写应用名

server {
    listen       80;
    server_name YOURDOMAIN;
    include tmd_loc.conf;
    access_log "pipe:/usr/sbin/cronolog /alidata/www/logs/tengine/YOURAPPNAME.%Y-%m-%d.log" aliyun_com;
    index index.html index.htm index.php;
    location / {
        proxy_set_header X-Forwarded-Scheme $scheme;
        proxy_set_header X-Forwarded-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:18080/YOURAPPNAME/;
        proxy_redirect http://appdomain/YOURAPPNAME/ /;
    }
    set_by_lua $invalid_ct "local ct = ngx.var.http_content_type
    if ct and #ct >= 2049 then return 1 ;else return 0 end";
    if ($invalid_ct = "1") {return 400;}
}